<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 530" width="1510" height="530" role="img" aria-labelledby="t d" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Proceso de atención de incidencias</title>
<desc id="d">Diagrama de proceso: detectar alerta, identificar activo, revisar ubicación, recorrido e historial, evaluar incidencia, ejecutar acción, confirmar estado y fin. Las decisiones sobre contexto suficiente, escalamiento y acción confirmada, con sus actividades asociadas, son casuísticas propuestas pendientes de validar y se muestran en ámbar discontinuo.</desc>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#315CFF"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#d97706"/></marker>
</defs>
<rect x="20" y="52" width="160" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="100.0" y="85.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Detectar alerta</text>
<rect x="225" y="52" width="160" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="305.0" y="85.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Identificar activo</text>
<rect x="430" y="52" width="190" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="525.0" y="76.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Revisar ubicación,</text>
<text x="525.0" y="94.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">recorrido e historial</text>
<polygon points="760,35.0 845.0,80 760,125.0 675.0,80" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="760" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">¿Contexto</text>
<text x="760" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">suficiente?</text>
<rect x="905" y="52" width="160" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="985.0" y="85.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Evaluar incidencia</text>
<polygon points="1190,35.0 1275.0,80 1190,125.0 1105.0,80" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="1190" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">¿Requiere</text>
<text x="1190" y="94" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">escalamiento?</text>
<rect x="1320" y="52" width="180" height="56" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="1410.0" y="76.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">P · Escalar al</text>
<text x="1410.0" y="94.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">responsable</text>
<path d="M180 80H225" fill="none" stroke="#315CFF" stroke-width="1.8" marker-end="url(#mb)"/>
<path d="M385 80H430" fill="none" stroke="#315CFF" stroke-width="1.8" marker-end="url(#mb)"/>
<path d="M620 80H675" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M845 80H905" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="875" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<path d="M1065 80H1105" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M1275 80H1320" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="1302" y="73" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<rect x="670" y="155" width="180" height="50" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="760.0" y="176.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">P · Actualizar o</text>
<text x="760.0" y="194.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">completar información</text>
<path d="M760 125V155" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="778" y="151" text-anchor="start" font-size="13" font-weight="600" fill="#475467">No</text>
<path d="M670 180H525V108" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M1190 125V250H420V302" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="1208" y="165" text-anchor="start" font-size="13" font-weight="600" fill="#475467">No</text>
<rect x="340" y="302" width="160" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="420.0" y="335.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Ejecutar acción</text>
<polygon points="640,285.0 730.0,330 640,375.0 550.0,330" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="640" y="326" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">¿Acción</text>
<text x="640" y="344" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">confirmada?</text>
<rect x="800" y="302" width="160" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="880.0" y="335.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Confirmar estado</text>
<rect x="1010" y="302" width="220" height="56" rx="28.0" fill="#eef2ff" stroke="#315CFF" stroke-width="2"/>
<text x="1120.0" y="335.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">Fin · estado confirmado</text>
<path d="M500 330H550" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M730 330H800" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="765" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<path d="M960 330H1010" fill="none" stroke="#315CFF" stroke-width="1.8" marker-end="url(#mb)"/>
<rect x="1320" y="302" width="180" height="56" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="1410.0" y="326.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">P · Esperar indicación</text>
<text x="1410.0" y="344.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">del responsable</text>
<path d="M1410 108V302" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M1410 358V500H380V358" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="900" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Según la indicación recibida · no es autorización automática</text>
<rect x="510" y="405" width="260" height="64" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="640.0" y="424.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">P · Verificar resultado</text>
<text x="640.0" y="442.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">antes de decidir el siguiente</text>
<text x="640.0" y="460.0" text-anchor="middle" font-size="14" font-weight="500" fill="#101828">paso · regla por validar</text>
<path d="M640 375V405" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="658" y="401" text-anchor="start" font-size="13" font-weight="600" fill="#475467">No</text>
<path d="M510 437H460V358" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
</svg>
