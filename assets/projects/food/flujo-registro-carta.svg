<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" width="1360" height="620" role="img" aria-labelledby="t d" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Registro y construcción de la carta</title>
<desc id="d">Diagrama de flujo: registro desde la landing, activación por correo e ingreso; primera tienda, carta, categorías, productos, adicionales y descuentos; revisión de la carta y fin de la guía. Las decisiones, errores y reintentos propuestos se muestran en ámbar.</desc>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#315CFF"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#d97706"/></marker>
</defs>
<text x="20" y="28.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#101828">01 / REGISTRO Y ACCESO</text>
<rect x="20" y="42" width="150" height="44" rx="22.0" fill="#fff" stroke="#315CFF" stroke-width="1.8"/>
<text x="95.0" y="68.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Visitar landing</text>
<rect x="220" y="42" width="150" height="44" rx="3" fill="#fff" stroke="#315CFF" stroke-width="1.8"/>
<text x="295.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Registro desde banner</text>
<text x="295.0" y="76.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">o formulario</text>
<rect x="420" y="42" width="150" height="44" rx="3" fill="#fff" stroke="#315CFF" stroke-width="1.8"/>
<text x="495.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Activar credencial</text>
<text x="495.0" y="76.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">por correo</text>
<rect x="620" y="42" width="170" height="44" rx="3" fill="#fff" stroke="#315CFF" stroke-width="1.8"/>
<text x="705.0" y="68.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Ingresar a la plataforma</text>
<polygon points="930,28.0 1000.0,64 930,100.0 860.0,64" fill="#fff8eb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="930" y="60.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">¿Acceso</text>
<text x="930" y="76.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">correcto?</text>
<rect x="1090" y="42" width="190" height="44" rx="3" fill="#fff8eb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1185.0" y="60.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">P · Corregir acceso</text>
<text x="1185.0" y="76.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">o reenviar correo</text>
<path d="M170 64 H220" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M370 64 H420" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M570 64 H620" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M790 64 H860" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<path d="M1000 64 H1090" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ma)"/>
<text x="1045" y="60.5" text-anchor="middle" font-size="12" font-weight="500" fill="#475467">No</text>
<path d="M1185 42 V16 H495 V42" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ma)"/>
<text x="840" y="10.5" text-anchor="middle" font-size="12" font-weight="500" fill="#475467">Reintentar según el problema</text>
<text x="20" y="140.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#101828">02 / CONSTRUCCIÓN DE LA CARTA</text>
<path d="M930 100 V160 H10 V260 H30" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
