<text x="140.0" y="478.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Fin de la guía</text>
<text x="140.0" y="494.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Primera carta terminada</text>
<path d="M505 482 H250" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<text x="378" y="478.5" text-anchor="middle" font-size="12" font-weight="500" fill="#475467">Sí</text>
<rect x="490" y="552" width="180" height="44" rx="3" fill="#fff8eb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="580.0" y="570.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">P · Editar pendientes</text>
<text x="580.0" y="586.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">y volver a revisar</text>
<path d="M580 520 V552" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ma)"/>
