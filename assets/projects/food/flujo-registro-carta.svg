<text x="715.0" y="256.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Registrar producto</text>
<text x="715.0" y="272.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">en la categoría</text>
<rect x="850" y="235" width="170" height="50" rx="3" fill="#fff" stroke="#315CFF" stroke-width="1.8"/>
<text x="935.0" y="256.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">Configurar adicionales</text>
<text x="935.0" y="272.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">y condicionales</text>
