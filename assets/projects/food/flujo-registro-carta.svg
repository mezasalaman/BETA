<text x="715" y="377.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">correcto?</text>
<path d="M715 285 V327" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<rect x="880" y="345" width="190" height="44" rx="3" fill="#fff8eb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="975.0" y="363.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">P · Corregir error</text>
<text x="975.0" y="379.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">y reintentar</text>
<path d="M790 365 H880" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ma)"/>
<text x="835" y="361.5" text-anchor="middle" font-size="12" font-weight="500" fill="#475467">No</text>
<path d="M975 345 V312 H760 V285" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ma)"/>
<text x="870" y="310.5" text-anchor="middle" font-size="12" font-weight="500" fill="#475467">Reintentar</text>
<path d="M715 403 V430 H1080 V443" fill="none" stroke="#315CFF" stroke-width="1.6" marker-end="url(#mb)"/>
<text x="735" y="428.5" text-anchor="start" font-size="12" font-weight="500" fill="#475467">Sí</text>
<polygon points="1080,444.0 1165.0,482 1080,520.0 995.0,482" fill="#fff8eb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1080" y="478.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">¿Añadir más</text>
<text x="1080" y="494.5" text-anchor="middle" font-size="13" font-weight="500" fill="#101828">contenido?</text>
<path d="M1165 482 H1340 V190 H510 V235" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ma)"/>
