<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Proceso de búsqueda y reserva de taller</title>
<desc id="d">Diagrama de proceso en dos filas: buscar servicio, aplicar filtros, revisar opciones, consultar detalle del taller, iniciar reserva, revisar resumen y reserva confirmada. Las decisiones sobre resultados, disponibilidad, datos completos y reserva confirmada, con sus rutas alternativas, son propuestas pendientes de validar y se muestran en ámbar discontinuo.</desc>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#315CFF"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#d97706"/></marker>
</defs>
<text x="20" y="27.0" text-anchor="start" font-size="13" font-weight="600" fill="#101828">01 / BÚSQUEDA Y SELECCIÓN</text>
<rect x="20" y="62" width="150" height="56" rx="28.0" fill="#eef2ff" stroke="#315CFF" stroke-width="2"/>
<text x="95.0" y="95.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Buscar servicio</text>
<rect x="215" y="62" width="130" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="280.0" y="95.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Aplicar filtros</text>
<polygon points="455,55.0 525.0,90 455,125.0 385.0,90" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="455" y="85.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">¿Hay</text>
<text x="455" y="104.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">resultados?</text>
<rect x="575" y="62" width="140" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="645.0" y="95.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Revisar opciones</text>
<rect x="760" y="62" width="160" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="840.0" y="85.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Consultar detalle</text>
<text x="840.0" y="104.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">del taller</text>
<polygon points="1035,55.0 1110.0,90 1035,125.0 960.0,90" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="1035" y="85.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">¿Hay</text>
<text x="1035" y="104.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">disponibilidad?</text>
<path d="M170 90H215" fill="none" stroke="#315CFF" stroke-width="1.8" marker-end="url(#mb)"/>
<path d="M345 90H385" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M525 90H575" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="550" y="85.0" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<path d="M715 90H760" fill="none" stroke="#315CFF" stroke-width="1.8" marker-end="url(#mb)"/>
<path d="M920 90H960" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<rect x="365" y="150" width="180" height="48" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="455.0" y="169.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">P · Ajustar búsqueda</text>
<text x="455.0" y="188.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">o filtros</text>
<path d="M455 125V150" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="472" y="148.0" text-anchor="start" font-size="13" font-weight="600" fill="#475467">No</text>
<path d="M365 174H280V118" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<rect x="935" y="150" width="200" height="48" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="1035.0" y="169.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">P · Consultar otra fecha</text>
<text x="1035.0" y="188.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">u otro taller</text>
<path d="M1035 125V150" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="1052" y="148.0" text-anchor="start" font-size="13" font-weight="600" fill="#475467">No</text>
<path d="M935 174H840V118" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="888" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Al detalle</text>
<path d="M1110 90H1180V235H95V302" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="1135" y="85.0" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<text x="20" y="267.0" text-anchor="start" font-size="13" font-weight="600" fill="#101828">02 / RESERVA  (continúa desde la fila superior)</text>
<text x="1170" y="257.0" text-anchor="end" font-size="12" font-weight="600" fill="#475467">continúa en la fila 02</text>
<rect x="20" y="302" width="150" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="95.0" y="335.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Iniciar reserva</text>
<polygon points="285,293.0 360.0,330 285,367.0 210.0,330" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="285" y="325.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">¿Datos</text>
<text x="285" y="344.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">completos?</text>
<rect x="410" y="302" width="150" height="56" rx="4" fill="#fff" stroke="#315CFF" stroke-width="2"/>
<text x="485.0" y="335.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Revisar resumen</text>
<polygon points="700,293.0 785.0,330 700,367.0 615.0,330" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="700" y="325.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">¿Reserva</text>
<text x="700" y="344.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">confirmada?</text>
<rect x="835" y="302" width="210" height="56" rx="28.0" fill="#eef2ff" stroke="#315CFF" stroke-width="2"/>
<text x="940.0" y="335.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Reserva confirmada</text>
<path d="M170 330H210" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M360 330H410" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="385" y="325.0" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<path d="M560 330H615" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<path d="M785 330H835" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="810" y="325.0" text-anchor="middle" font-size="13" font-weight="600" fill="#475467">Sí</text>
<rect x="205" y="405" width="160" height="50" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="285.0" y="425.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">P · Corregir datos</text>
<text x="285.0" y="444.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">y comprobarlos</text>
<path d="M268 359V405" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="260" y="391.0" text-anchor="end" font-size="13" font-weight="600" fill="#475467">No</text>
<path d="M305 405V359" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="315" y="391.0" text-anchor="start" font-size="12" font-weight="600" fill="#475467">Vuelve a comprobar</text>
<rect x="605" y="405" width="190" height="50" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="700.0" y="425.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">P · Consultar estado</text>
<text x="700.0" y="444.5" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">antes de repetir</text>
<path d="M700 367V405" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="717" y="397.0" text-anchor="start" font-size="13" font-weight="600" fill="#475467">No</text>
<rect x="635" y="500" width="130" height="40" rx="4" fill="#fff8eb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="700.0" y="525.0" text-anchor="middle" font-size="15" font-weight="500" fill="#101828">Ruta por validar</text>
<path d="M700 455V500" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="717" y="489.0" text-anchor="start" font-size="12" font-weight="600" fill="#475467">Según estado verificado</text>
</svg>
